spring:
  application:
    name: analyzer

  datasource:
    url: jdbc:mysql://localhost:3306/resume_analyzer?createDatabaseIfNotExist=true
    username: root
    password: PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  servlet:
   multipart:
    max-file-size: ${MAX_FILE_SIZE:5MB}
    max-request-size: ${MAX_REQUEST_SIZE:6MB}

  mail:
   host: ${MAIL_HOST:smtp.gmail.com}
   port: ${MAIL_PORT:587}
   username: ${MAIL_USERNAME:}
   password: ${MAIL_PASSWORD:}
   properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

server:
  port: ${SERVER_PORT:8080}
  

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
    issuer: analyzer

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  storage:
    location: ${FILE_STORAGE_LOCATION:./storage/resumes}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:5242880}

  openai:
    api-key: ${OPENAI_API_KEY:ollama}
    base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
    model: ${OPENAI_MODEL:llama3.2}
    timeout-seconds: ${OPENAI_TIMEOUT:180}
    enabled: ${OPENAI_ENABLED:true}

  frontend:
    reset-password-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset-password}

  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.airesume.analyzer: DEBUG
    org.springframework.security: INFO
